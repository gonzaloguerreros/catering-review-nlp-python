[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "catering-review-nlp"
version     = "1.0.0"
description = "NLP review intelligence pipeline for a B2B catering marketplace"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "nltk==3.9.4",
    "textblob==0.20.0",
    "wordcloud==1.9.6",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pycodestyle==2.14.0",
    "pyflakes==3.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.pycodestyle]
max-line-length = 100
ignore = ["E203", "W503"]
