[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "catering-review-nlp"
version     = "1.0.0"
description = "NLP review intelligence pipeline for a B2B catering marketplace"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.4",
    "scikit-learn==1.3.2",
    "nltk==3.9.1",
    "textblob==0.18.0.post0",
    "wordcloud==1.9.4",
    "matplotlib==3.7.5",
    "seaborn==0.13.2",
    "scipy==1.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pycodestyle==2.11.1",
    "pyflakes==3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.pycodestyle]
max-line-length = 100
ignore = ["E203", "W503"]
